name: GitHub Actions lint
on:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    name: GitHub Actions
    uses: kellen-miller/ci/.github/workflows/gh-actions-lint.yaml@7cb397821439001322396a1b022cfa47dbe3a553 # v1.0.3
  duplication:
    name: Code duplication (CPD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/code-duplication@7cb397821439001322396a1b022cfa47dbe3a553 # v1.0.3

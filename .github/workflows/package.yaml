name: Package
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - rust-toolchain.toml
      - src/**
      - tests/**
      - xtask/**
      - providers/**
      - packaging/**
      - templates/**
      - examples/**
      - scripts/**
      - LICENSE
      - LICENSES/**
      - NOTICE
      - .cargo/**
      - .github/workflows/package.yaml
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Publish a semantic release after package qualification (main only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: package-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  artifact-build:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: kellen-miller/ci/.github/workflows/pr-artifact-build.yaml@aac24776009ea1ba9042ae3bb8b84f9bf463b951
    with:
      source-paths: '["Cargo.toml","Cargo.lock","build.rs","rust-toolchain.toml","src/**","tests/**","xtask/**","providers/**","packaging/**","templates/**","examples/**","scripts/**","LICENSE","LICENSES/**","NOTICE",".cargo/**",".github/workflows/package.yaml"]'
      artifacts: '["outrider-linux-amd64","outrider-linux-amd64-image"]'
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        uses: kellen-miller/ci/.github/actions/release@1edef8bc9492ec29052f26cc32e21e1fdeb73373 # v1.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: 'true'
          first-release-version: '0.1.0'
  package:
    needs: [preview, artifact-build]
    if: always() && needs.artifact-build.result == 'success' && needs.artifact-build.outputs.build == 'true' && (needs.preview.result == 'success' || needs.preview.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare musl build tools and target
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools cmake clang binutils file
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 x86_64-unknown-linux-musl
      - id: version
        name: Select embedded version
        env:
          RELEASE_VERSION: ${{ needs.preview.outputs.version }}
        run: |
          version="${RELEASE_VERSION:-$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "outrider") | .version')}"
          printf 'OUTRIDER_VERSION=%s\nPACKAGE=%s\nBUNDLE=%s\nARCHIVES=%s\n' "$version" "$RUNNER_TEMP/outrider-package" "$RUNNER_TEMP/outrider-providers" "$RUNNER_TEMP/outrider-archives" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/outrider-provider-builds
          key: outrider-providers-linux-amd64-go1.27.3-${{ hashFiles('providers/manifest.json') }}
      - name: Build static deployable binaries
        uses: kellen-miller/ci/.github/actions/rust-check@1edef8bc9492ec29052f26cc32e21e1fdeb73373 # v1.0.1
        env:
          CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
          CC_x86_64_unknown_linux_musl: musl-gcc
        with:
          toolchain: '1.99.1'
          checks: build
          all-features: 'false'
          build-profile: release
          build-targets: bins
          cache-key: linux-amd64-musl-release-opt1-no-lto-v1
      - name: Test package boundaries and build native providers
        run: |
          cargo test --locked -p outrider-xtask package
          cargo xtask build-provider-bundle --go-version 1.27.3 --output "$BUNDLE" --source-cache "$HOME/.cache/outrider-provider-builds/sources" --go-cache-root "$HOME/.cache/outrider-provider-builds/go"
      - name: Assemble and verify package
        run: |
          cargo xtask package --binary target/x86_64-unknown-linux-musl/release/outrider --provider-bundle "$BUNDLE" --output "$PACKAGE" --version "$OUTRIDER_VERSION"
          "$PACKAGE/bin/outrider" build-info
          test "$("$PACKAGE/bin/outrider" --version)" = "outrider $OUTRIDER_VERSION"
          file "$PACKAGE/bin/outrider"
          if readelf --program-headers "$PACKAGE/bin/outrider" | grep -q INTERP; then exit 1; fi
          sudo install -D -m 0755 "$PACKAGE/bin/outrider" /opt/outrider/bin/outrider
          systemd-analyze verify "$PACKAGE/packaging/outrider.service"
          jq -r '.files[] | [.path, .sha256, .mode] | @tsv' "$PACKAGE/package-manifest.json" | while IFS=$'\t' read -r path digest mode; do
            test "$(sha256sum "$PACKAGE/$path" | cut -d' ' -f1)" = "$digest"
            test "$((8#$(stat -c '%a' "$PACKAGE/$path")))" = "$mode"
          done
      - name: Invoke package inside GARM 0.2.1 BusyBox image
        env:
          GARM_IMAGE: ghcr.io/cloudbase/garm@sha256:c74079c24bdf9dacbd55f9ac29f149502b909827388430205b8cca65b04a7dda
        run: |
          docker run --rm --platform linux/amd64 --network none --read-only --entrypoint /bin/sh -v "$PACKAGE:/opt/outrider:ro" -e GARM_COMMAND=GetVersion -e GARM_CONTROLLER_ID=package-smoke -e GARM_PROVIDER_CONFIG_FILE=/opt/outrider/examples/config.toml -e EXPECTED_VERSION="$OUTRIDER_VERSION" "$GARM_IMAGE" -c 'test -x /bin/busybox && test "$(/opt/outrider/bin/outrider)" = "$EXPECTED_VERSION"'
      - name: Prepare OCI build context
        run: |
          mkdir "$RUNNER_TEMP/outrider-image"
          cp packaging/Dockerfile "$RUNNER_TEMP/outrider-image/Dockerfile"
          cp -a "$PACKAGE" "$RUNNER_TEMP/outrider-image/package"
      - name: Build container with shared CI
        uses: kellen-miller/ci/.github/actions/docker-publish-core@1edef8bc9492ec29052f26cc32e21e1fdeb73373 # v1.0.1
        with:
          image: ghcr.io/${{ github.repository }}
          tags: type=raw,value=smoke-${{ github.run_id }}
          push: 'false'
          context: ${{ runner.temp }}/outrider-image
          platforms: linux/amd64
          outputs: type=docker,dest=${{ runner.temp }}/outrider-image.tar
          provenance: 'false'
          sbom: 'false'
      - name: Verify installation, container and authenticated GARM lifecycle bridge
        env:
          SMOKE_IMAGE: ghcr.io/${{ github.repository }}:smoke-${{ github.run_id }}
        run: |
          docker load --input "$RUNNER_TEMP/outrider-image.tar"
          cargo xtask check-installed-package --package "$PACKAGE" --image "$SMOKE_IMAGE"
      - name: Archive qualified package
        run: |
          mkdir "$ARCHIVES"
          archive="outrider-$OUTRIDER_VERSION-linux-amd64.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner -C "$PACKAGE" -czf "$ARCHIVES/$archive" .
          cd "$ARCHIVES"
          sha256sum "$archive" > "$archive.sha256"
      - name: Verify documented root installation
        run: |
          root_install="$(sudo mktemp -d /var/lib/outrider-install-XXXXXX)"
          sudo mkdir "$root_install/package"
          sudo tar -xzf "$ARCHIVES/outrider-$OUTRIDER_VERSION-linux-amd64.tar.gz" -C "$root_install/package"
          sudo stat -c '%a %u:%g %n' / /var /var/lib "$root_install" "$root_install/package"
          sudo "$root_install/package/bin/outrider" install --package "$root_install/package" --prefix "$root_install/installed" --config "$root_install/config/config.toml" --state "$root_install/state" --systemd-unit "$root_install/outrider.service" --uid "$(id -u)" --gid "$(id -g)"
          sudo "$root_install/package/bin/outrider" install --package "$root_install/package" --prefix "$root_install/installed" --config "$root_install/config/config.toml" --state "$root_install/state" --systemd-unit "$root_install/outrider.service" --uid "$(id -u)" --gid "$(id -g)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: outrider-linux-amd64
          path: ${{ runner.temp }}/outrider-archives/*
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: outrider-linux-amd64-image
          path: ${{ runner.temp }}/outrider-image.tar
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    needs: [preview, package]
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main' && needs.preview.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: outrider-linux-amd64
          path: ${{ runner.temp }}/release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: outrider-linux-amd64-image
          path: ${{ runner.temp }}/release-image
      - id: release
        uses: kellen-miller/ci/.github/actions/release@1edef8bc9492ec29052f26cc32e21e1fdeb73373 # v1.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          first-release-version: '0.1.0'
      - name: Attach qualified archive to matching release
        if: steps.release.outputs.release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.git_tag }}
        run: |
          test "$RELEASE_VERSION" = "$PACKAGE_VERSION"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/release-assets/*
      - name: Log in to GHCR for the qualified image
        if: steps.release.outputs.release_published == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image without rebuilding
        if: steps.release.outputs.release_published == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          test "$RELEASE_VERSION" = "$PACKAGE_VERSION"
          docker load --input "$RUNNER_TEMP/release-image/outrider-image.tar"
          docker tag "$IMAGE:smoke-${{ github.run_id }}" "$IMAGE:$RELEASE_VERSION"
          docker push "$IMAGE:$RELEASE_VERSION"
  artifact-source:
    needs: [artifact-build, package]
    if: github.event_name == 'pull_request' && needs.artifact-build.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          SOURCE: ${{ needs.artifact-build.outputs.source }}
        run: printf '%s\n' "$SOURCE" > source.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.artifact-build.outputs.source }}
          path: source.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

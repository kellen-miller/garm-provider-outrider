name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: tests/fixtures/**/go.sum
      # Linux owns shared policy checks; acceptance compiles and runs the full Mac graph.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: '1.99.1'
          rustflags: ''
          cache-key: macos-tests-v1
      - name: Install pinned bootstrap validators
        run: |
          cargo xtask install-contract-tools "$RUNNER_TEMP/outrider-contract-tools"
          echo "$RUNNER_TEMP/outrider-contract-tools/bin" >> "$GITHUB_PATH"
      - name: Verify required acceptance cases
        run: |
          export PATH="$RUNNER_TEMP/outrider-contract-tools/bin:$PATH"
          cargo xtask check-acceptance --all
  linux-host:
    name: Linux host contracts
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: tests/fixtures/**/go.sum
      - uses: kellen-miller/ci/.github/actions/rust-check@b08ba515b64f3563e51722faaea3d20d22283ed7
        with:
          toolchain: '1.99.1'
          checks: fmt clippy
          all-features: 'true'
      - name: Run Linux host contracts
        run: cargo xtask check-linux-contracts

name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.7'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.2'
      - uses: kellen-miller/ci/.github/actions/rust-check@b098bcd37eafde344afa84c82a04e63e5ee3a450
        with:
          toolchain: '1.99.1'
          checks: build
          all-features: 'true'
          cache-key: macos-tests-v1
      - name: Install pinned bootstrap validators
        run: |
          cargo xtask install-contract-tools "$RUNNER_TEMP/outrider-contract-tools"
          echo "$RUNNER_TEMP/outrider-contract-tools/bin" >> "$GITHUB_PATH"
      - name: Verify required acceptance cases
        run: |
          export PATH="$RUNNER_TEMP/outrider-contract-tools/bin:$PATH"
          cargo xtask check-acceptance --all
  linux-host:
    name: Linux host contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.2'
      - uses: kellen-miller/ci/.github/actions/rust-check@b098bcd37eafde344afa84c82a04e63e5ee3a450
        with:
          toolchain: '1.99.1'
          checks: fmt clippy
          all-features: 'true'
      - name: Run Linux host contracts
        run: cargo xtask check-linux-contracts
